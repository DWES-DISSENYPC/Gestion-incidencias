<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>Lista de tecnicos</h1>

    <ul>

        <li th:each="t : ${lista}">

            <a th:href="@{/tecnicos/{id}(id={${t.id}})}" th:text="|${t.nombre} (${t.tipo})|"></a>

        </li>

    </ul>

    <div>

        <a th:href="@{/tecnicos/nuevo}">Nuevo técnico</a>

    </div>

</body>
</html>
